# Publica automaticamente apÃ³s mudanÃ§as no Worker, interface ou migraÃ§Ãµes.
name: Deploy Controle Adega

on:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - name: Testar regras da aplicacao
        run: npm test
      - name: Validar pacote
        run: npm run check
      - name: Aplicar migraÃ§Ãµes D1
        run: npx wrangler d1 migrations apply controle-adega --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publicar Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
