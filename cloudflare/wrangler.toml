name = "controle-adega"
main = "src/worker.js"
compatibility_date = "2026-07-20"
workers_dev = true

[[durable_objects.bindings]]
name = "ORDER_LIVE"
class_name = "OrderLive"

[[migrations]]
tag = "v1-order-live"
new_sqlite_classes = ["OrderLive"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "controle-adega"
database_id = "574797ee-67fc-4381-9294-6fe0e31da9eb"
migrations_dir = "migrations"

[vars]
APP_TIMEZONE = "America/Sao_Paulo"
